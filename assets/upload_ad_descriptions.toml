# Conservative defaults derived from verified PCBoard archive corpus matches.
# Add uncertain rules as report_only first and promote them only after reviewing
# both positive and negative matches.
# Use literal_lines for whole-line text (case, colors and whitespace normalized),
# or lines for regular expressions. Specify exactly one nonempty list per rule.

[[description_rule]]
id = "shogunat-footer"
lines = ['^.*fucking fast shareware.*$', '^.*shogunat 030 746 67 93.*$']
action = "auto_clean"

[[description_rule]]
id = "liquid-whq-footer"
inline_start = "I WAS FIRST ON"
literal_lines = ["I WAS FIRST ON LiQUiD'S WHQ, @USER@", "WHY DON'T YA ASK FOR JAPANESE BOARDS"]
action = "auto_clean"

