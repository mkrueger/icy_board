[package]
name = "icy_board-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
icy_board_engine = { path = "../crates/icy_board_engine" }
arbitrary = { version = "1", features = ["derive"] }

[lib]
name = "icy_board_fuzz"
path = "src/lib.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ppe_load"
path = "fuzz_targets/ppe_load.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ppe_decompile"
path = "fuzz_targets/ppe_decompile.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ppe_structured"
path = "fuzz_targets/ppe_structured.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ppe_roundtrip"
path = "fuzz_targets/ppe_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ppe_disassemble"
path = "fuzz_targets/ppe_disassemble.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ppl_parse"
path = "fuzz_targets/ppl_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ppl_compile"
path = "fuzz_targets/ppl_compile.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ppl_generated"
path = "fuzz_targets/ppl_generated.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ppl_format_roundtrip"
path = "fuzz_targets/ppl_format_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ppl_truncate"
path = "fuzz_targets/ppl_truncate.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ppl_preprocess"
path = "fuzz_targets/ppl_preprocess.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ppl_mutate"
path = "fuzz_targets/ppl_mutate.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
