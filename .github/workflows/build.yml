name: Build
on:
  workflow_run:
    workflows: ["Run Tests"]
    branches: [main]
    types: 
      - completed
env:
  CARGO_TERM_COLOR: always
jobs:
  build_linux:
   runs-on: ubuntu-latest
   if: github.event.workflow_run.conclusion == 'success'
   steps:
   - uses: actions/checkout@v4
   - name: Get version
     run: |
       export version=$(python3 tools/prep_diz.py "file_id.diz")
       echo "VERSION=$version" >> $GITHUB_ENV
       echo "Version: $version"
   - name: Build
     id: build
     run: |
       cargo build --release --locked
       echo "Copy $DEB to icboard.deb"
       mkdir bin
       mv target/release/icboard bin
       mv target/release/icbsetup bin
       mv target/release/icbmailer bin
       mv target/release/icbsm bin
       mv target/release/icbfile bin
       mv target/release/mkicbmnu bin
       mv target/release/mkicbtxt bin
       mv target/release/pplc bin
       mv target/release/ppld bin
       mv target/release/ppl-lsp bin
   - name: 'Upload zip'
     uses: actions/upload-artifact@v4
     with:
       name: icy_board_linux_${{ env.VERSION }}
       path: |
         bin/icboard
         bin/icbsetup
         bin/icbmailer
         bin/icbsm
         bin/icbfile
         bin/mkicbmnu
         bin/mkicbtxt
         bin/pplc
         bin/ppld
         bin/ppl-lsp
         file_id.diz
         INSTALL.md
  build_windows:
   runs-on: windows-latest
   if: github.event.workflow_run.conclusion == 'success'
   steps:
   - uses: actions/checkout@v4
   - name: Get version
     run: |
       $VERSION=$(python tools\prep_diz.py "file_id.diz")
       Add-Content -Path $env:GITHUB_ENV -Value "VERSION=$VERSION" 
       echo "Version $VERSION"
   - name: Build
     id: build
     run: |
       set RUSTFLAGS=-C target-feature=+crt-static
       cargo build --release --locked
       echo "Copy $DEB to icy_board.deb"
       mkdir bin
       move target/release/icboard.exe bin
       move target/release/icbsetup.exe bin
       move target/release/icbmailer.exe bin
       move target/release/icbsm.exe bin
       move target/release/icbfile.exe bin
       move target/release/mkicbmnu.exe bin
       move target/release/mkicbtxt.exe bin
       move target/release/pplc.exe bin
       move target/release/ppld.exe bin
       move target/release/ppl-lsp.exe bin
   - name: 'Upload zip'
     uses: actions/upload-artifact@v4
     with:
       name: icy_board_windows_${{ env.VERSION }}
       path: |
         bin/icboard.exe
         bin/icbsetup.exe
         bin/icbmailer.exe
         bin/icbsm.exe
         bin/icbfile.exe
         bin/mkicbmnu.exe
         bin/mkicbtxt.exe
         bin/pplc.exe
         bin/ppld.exe
         bin/ppl-lsp.exe
         file_id.diz
         INSTALL.md
  build_mac:
   runs-on: macos-latest
   if: github.event.workflow_run.conclusion == 'success'
   steps:
   - uses: actions/checkout@v4
   - name: Get version
     run: |
       export version=$(python3 tools/prep_diz.py "file_id.diz")
       echo "VERSION=$version" >> $GITHUB_ENV
       echo "Version: $version"
   - name: Install rust compilation targets
     run: |
       rustup target add aarch64-apple-darwin
       rustup target add x86_64-apple-darwin
   - name: Build
     id: build
     run: |
       cargo build --release --locked --target aarch64-apple-darwin
       cargo build --release --locked --target x86_64-apple-darwin

       echo "Copy $DEB to icy_board.deb"
       mkdir -p aarch64-apple-darwin/bin
        mv target/aarch64-apple-darwin/release/icboard aarch64-apple-darwin/bin
        mv target/aarch64-apple-darwin/release/icbsetup aarch64-apple-darwin/bin
        mv target/aarch64-apple-darwin/release/icbmailer aarch64-apple-darwin/bin
        mv target/aarch64-apple-darwin/release/icbsm aarch64-apple-darwin/bin
        mv target/aarch64-apple-darwin/release/icbfile aarch64-apple-darwin/bin
        mv target/aarch64-apple-darwin/release/mkicbmnu aarch64-apple-darwin/bin
        mv target/aarch64-apple-darwin/release/mkicbtxt aarch64-apple-darwin/bin
        mv target/aarch64-apple-darwin/release/pplc aarch64-apple-darwin/bin
        mv target/aarch64-apple-darwin/release/ppld aarch64-apple-darwin/bin
        mv target/aarch64-apple-darwin/release/ppl-lsp aarch64-apple-darwin/bin

       mkdir -p x86_64-apple-darwin/bin
        mv target/x86_64-apple-darwin/release/icboard x86_64-apple-darwin/bin
        mv target/x86_64-apple-darwin/release/icbsetup x86_64-apple-darwin/bin
        mv target/x86_64-apple-darwin/release/icbmailer x86_64-apple-darwin/bin
        mv target/x86_64-apple-darwin/release/icbsm x86_64-apple-darwin/bin
        mv target/x86_64-apple-darwin/release/icbfile x86_64-apple-darwin/bin
        mv target/x86_64-apple-darwin/release/mkicbmnu x86_64-apple-darwin/bin
        mv target/x86_64-apple-darwin/release/mkicbtxt x86_64-apple-darwin/bin
        mv target/x86_64-apple-darwin/release/pplc x86_64-apple-darwin/bin
        mv target/x86_64-apple-darwin/release/ppld x86_64-apple-darwin/bin
        mv target/x86_64-apple-darwin/release/ppl-lsp x86_64-apple-darwin/bin

   - name: 'Upload zip'
     uses: actions/upload-artifact@v4
     with:
       name: icy_board_osx_aarch64-apple-darwin_${{ env.VERSION }}
       path: |
         aarch64-apple-darwin/bin/icboard
         aarch64-apple-darwin/bin/icbsetup
         aarch64-apple-darwin/bin/icbmailer
         aarch64-apple-darwin/bin/icbsm
         aarch64-apple-darwin/bin/icbfile
         aarch64-apple-darwin/bin/mkicbmnu
         aarch64-apple-darwin/bin/mkicbtxt
         aarch64-apple-darwin/bin/pplc
         aarch64-apple-darwin/bin/ppld
         aarch64-apple-darwin/bin/ppl-lsp
         file_id.diz
         INSTALL.md
   - name: 'Upload zip'
     uses: actions/upload-artifact@v4
     with:
       name: icy_board_osx_x86_64-apple-darwin_${{ env.VERSION }}
       path: |
         x86_64-apple-darwin/bin/icboard
         x86_64-apple-darwin/bin/icbsetup
         x86_64-apple-darwin/bin/icbmailer
         x86_64-apple-darwin/bin/icbsm
         x86_64-apple-darwin/bin/icbfile
         x86_64-apple-darwin/bin/mkicbmnu
         x86_64-apple-darwin/bin/mkicbtxt
         x86_64-apple-darwin/bin/pplc
         x86_64-apple-darwin/bin/ppld
         x86_64-apple-darwin/bin/ppl-lsp
         file_id.diz
         INSTALL.md
  build_vs_extension:
   runs-on: ubuntu-latest
   if: github.event.workflow_run.conclusion == 'success'
   # The platform builds hold the servers that go into the packages.
   needs: [build_linux, build_windows, build_mac]
   steps:
   - uses: actions/checkout@v4
   - uses: pnpm/action-setup@v2
     name: Install pnpm
     with:
       version: 8.15.7
       run_install: false
   - name: Get version
     run: |
       export version=$(python3 ./tools/get_version.py)
       echo "Version: $VERSION"
       echo "VERSION=$version" >> $GITHUB_ENV
   - name: Download the servers
     uses: actions/download-artifact@v4
     with:
       path: servers
   - name: Install required libraries
     run: |
       cd editors/vscode
       pnpm install --frozen-lockfile
   - name: Build
     id: build
     run: |
       cd editors/vscode
       npm run compile

       # One package per platform, each with the server that belongs to it.
       package() {
         found=$(find "$GITHUB_WORKSPACE/servers" -path "$2" | head -1)
         if [ -z "$found" ]; then
           echo "no server for $1 below servers/ (looked for $2)"
           exit 1
         fi
         rm -rf server
         mkdir server
         cp "$found" "server/$(basename "$found")"
         chmod +x server/*
         pnpm exec vsce package --no-dependencies --target "$1"
       }
       package linux-x64    '*icy_board_linux_*/bin/ppl-lsp'
       package win32-x64    '*icy_board_windows_*/bin/ppl-lsp.exe'
       package darwin-arm64 '*aarch64-apple-darwin/bin/ppl-lsp'
       package darwin-x64   '*x86_64-apple-darwin/bin/ppl-lsp'

       # And one for everyone else, which asks for a server on the PATH.
       rm -rf server
       pnpm run package
   - name: 'Upload zip'
     uses: actions/upload-artifact@v4
     with:
       name: icyboard-ppl-${{ env.VERSION }}-vsix
       path: editors/vscode/*.vsix
       if-no-files-found: error

  build_docs_pdf:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
    - uses: actions/checkout@v4
    
    - name: Get version
      run: |
        export version=$(python3 tools/prep_diz.py "file_id.diz")
        echo "VERSION=$version" >> $GITHUB_ENV
        echo "Version: $version"
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          latexmk \
          texlive-latex-recommended \
          texlive-latex-extra \
          texlive-fonts-recommended \
          texlive-fonts-extra \
          texlive-xetex \
          xindy
        pip install --upgrade pip
        pip install sphinx sphinx_rtd_theme
        # Install any other Sphinx extensions if needed
        # pip install sphinx-autodoc-typehints sphinxcontrib-bibtex etc.
    
    - name: Build PDF documentation
      run: |
        cd docs
        # Build the latex files first
        make latex
        # Build the PDF from latex
        cd build/latex
        make
        # Copy PDF to a better location
        cp *.pdf ../../../icy_board_documentation_${{ env.VERSION }}.pdf
    
    - name: Upload PDF documentation
      uses: actions/upload-artifact@v4
      with:
        name: icy_board_documentation_${{ env.VERSION }}
        path: icy_board_documentation_${{ env.VERSION }}.pdf