name: Reference

on:
  pull_request:
    paths:
      - "docs/**"
      - "crates/icy_board_help/data/**"
      - "crates/tree-sitter-ppl/README.md"
      - "compat/*.md"
      - "assets/**"
      - "INSTALL.md"
      - "Cargo.toml"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "crates/icy_board_help/data/**"
      - "crates/tree-sitter-ppl/README.md"
      - "compat/*.md"
      - "assets/**"
      - "INSTALL.md"
      - "Cargo.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: Deploy this reference to GitHub Pages
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: pip install -r docs/requirements.txt
      - name: Test reference validator
        run: python -m unittest docs.test_check_reference docs.test_reference_links
      - name: Build reference
        env:
          ICY_REFERENCE_REVISION: ${{ github.sha }}
        run: make -C docs html
      - name: Check internal links and command coverage
        run: python docs/check_reference.py docs/build/html
      - uses: actions/upload-artifact@v4
        with:
          name: icyboard-reference-html
          path: docs/build/html/
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        with:
          path: docs/build/html/

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: reference-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy reference
        id: deployment
        uses: actions/deploy-pages@v4
