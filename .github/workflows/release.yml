name: Release

# Everything a tag should hand out: the board and its tools for each platform,
# the bare language server the editor extensions download, and one VS Code
# package per platform. Every file is attached to the release on its own, so it
# can be downloaded without unpacking an archive of archives first.
on:
  push:
    tags: ["*"]
  workflow_dispatch:
    inputs:
      tag:
        description: The tag whose release the files are attached to
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  open_release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Open the release unless it is already there
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "$TAG already has a release, attaching to it"
          else
            gh release create "$TAG" --repo "$REPO" --draft --title "$TAG" --generate-notes
            echo "opened a draft release for $TAG - review it and press publish"
          fi

      # A release page is a list of file names, and the beta showed that the list
      # alone does not say which one to take.
      - name: Put the download guide above the notes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          guide=$(sed "s/#TAG/$TAG/g" .github/release-guide.md)
          notes=$(gh release view "$TAG" --repo "$REPO" --json body -q .body)
          # Drop the guide an earlier run wrote, so re-running does not stack them up.
          if printf '%s\n' "$notes" | grep -qF '<!-- /download-guide -->'; then
            notes=$(printf '%s\n' "$notes" | sed '1,/<!-- \/download-guide -->/d')
          fi
          printf '%s\n%s\n' "$guide" "$notes" | gh release edit "$TAG" --repo "$REPO" --notes-file -

  board:
    needs: open_release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            platform: macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Add the target
        run: rustup target add ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Build
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: cargo build --release --locked --target ${{ matrix.target }}

      # The layout INSTALL.md describes: bin/ with every program beside it.
      - name: Collect what a sysop downloads
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          suffix=""
          case "$TARGET" in *windows*) suffix=".exe";; esac

          mkdir -p bin
          for tool in icboard icbsetup icbsm icbfile icbmailer mkicbmnu mkicbtxt pplc ppld ppl-lsp; do
            cp "target/$TARGET/release/$tool$suffix" bin/
          done
          sed "s/#VERSION/$TAG/g" data/file_id.diz > file_id.diz

          echo "ARCHIVE=icyboard-$TAG-${{ matrix.platform }}.zip" >> "$GITHUB_ENV"
          echo "SERVER=target/$TARGET/release/ppl-lsp$suffix" >> "$GITHUB_ENV"

      - name: Pack it
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          zip -r "$ARCHIVE" bin file_id.diz INSTALL.md LICENSE
          tar -czf "ppl-lsp-$TAG-${{ matrix.platform }}.tar.gz" -C "target/${{ matrix.target }}/release" ppl-lsp

      - name: Pack it
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path bin, file_id.diz, INSTALL.md, LICENSE -DestinationPath "$env:ARCHIVE"
          Compress-Archive -Path "target\${{ matrix.target }}\release\ppl-lsp.exe" -DestinationPath "ppl-lsp-${env:TAG}-${{ matrix.platform }}.zip"

      - name: Attach it to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh release upload "$TAG" "$ARCHIVE" "ppl-lsp-$TAG-${{ matrix.platform }}".* --repo "$REPO" --clobber

      # The VS Code packages carry the server that belongs to their platform.
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.platform }}
          path: ${{ env.SERVER }}
          if-no-files-found: error

  vscode:
    needs: board
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - uses: pnpm/action-setup@v2
        name: Install pnpm
        with:
          version: 8.15.7
          run_install: false

      - name: Download the servers
        uses: actions/download-artifact@v4
        with:
          path: servers

      - name: Build one package per platform
        run: |
          cd editors/vscode
          pnpm install --frozen-lockfile
          npm run compile

          package() {
            server="$GITHUB_WORKSPACE/servers/server-$2/$3"
            if [ ! -f "$server" ]; then
              echo "no server for $2 at $server"
              exit 1
            fi
            rm -rf server
            mkdir server
            cp "$server" server/
            chmod +x server/*
            # --target is the id VS Code matches on install; the file name follows
            # the release scheme, and carries the tag rather than package.json's
            # version, which cannot hold a pre-release suffix.
            pnpm exec vsce package --no-dependencies --target "$1" -o "ppl-vscode-$TAG-$2.vsix"
          }
          package linux-x64    linux-x64   ppl-lsp
          package win32-x64    windows-x64 ppl-lsp.exe
          package darwin-arm64 macos-arm64 ppl-lsp
          package darwin-x64   macos-x64   ppl-lsp

          # And one for everyone else, which asks for a server on the PATH.
          rm -rf server
          pnpm exec vsce package --no-dependencies -o "ppl-vscode-$TAG-no-server.vsix"

      - name: Attach every package to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh release upload "$TAG" editors/vscode/*.vsix --repo "$REPO" --clobber

  manual:
    needs: open_release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install what the PDF needs
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            latexmk \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            texlive-xetex \
            xindy
          pip install --upgrade pip
          pip install sphinx sphinx_rtd_theme

      - name: Build the manual
        run: |
          make -C docs latex
          make -C docs/build/latex
          cp docs/build/latex/*.pdf "icyboard-manual-$TAG.pdf"

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh release upload "$TAG" "icyboard-manual-$TAG.pdf" --repo "$REPO" --clobber
