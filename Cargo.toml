[workspace]
resolver = "2"
members = [
	"crates/icy_board_engine",
	"crates/dizbase",
	"crates/codepages",
	"crates/pplc",
	"crates/ppld",
	"crates/ppl-lsp",
	"crates/icy_board_tui",
	"crates/mkicbmnu",
	"crates/icy_net",
	"crates/mkicbtxt",
	"crates/icboard",
	"crates/icbsetup",
	"crates/icbmailer",
	"crates/icbsm",
	"crates/icbfile",
	"crates/icbadmin",
	"crates/tree-sitter-ppl",
]
[workspace.package]
version = "0.2.1"
edition = "2024"
authors = ["Mike Krüger <mkrueger@posteo.de>"]

[workspace.dependencies]
codepages = { path = "crates/codepages" }
dizbase = { path = "crates/dizbase" }
jamjam = { git = "https://github.com/mkrueger/jamjam", branch = "main" }
icy_board_tui = { path = "crates/icy_board_tui" }

icy_net = { path = "crates/icy_net" }
icy_board_engine = { path = "crates/icy_board_engine" }
icy_engine = { git = "https://github.com/mkrueger/icy_tools", rev = "cace73595f6acf44d1b502f6c47e0aa907ff0785" }
icy_engine_gui = { git = "https://github.com/mkrueger/icy_tools", rev = "cace73595f6acf44d1b502f6c47e0aa907ff0785" }
icy_engine_scripting = { git = "https://github.com/mkrueger/icy_tools", rev = "cace73595f6acf44d1b502f6c47e0aa907ff0785" }
icy_parser_core = { git = "https://github.com/mkrueger/icy_tools", rev = "cace73595f6acf44d1b502f6c47e0aa907ff0785" }
icy_sixel = "0.6.0"
image = "0.25.10"
jxl-oxide = { version = "0.12.6", features = ["image"] }
zune-jpegxl = "0.5.2"
zune-core = "0.5.3"

lazy_static = "1.5.0"
semver = { version = "1.0.28", features = ["serde"] }
thiserror = "2.0.20"
argh = "0.1.19"
crossterm = "0.29.0"
ratatui = "0.30.2"
terminfo = "0.9.0"
ratatui-image = { version = "11.0.6", default-features = false, features = ["crossterm", "image-defaults"] }
rodio = { version = "0.22.2", features = ["tracing"] }
log = "0.4.33"
chrono = { version = "0.4.45", features = ["serde"] }
bstr = "1.13.1"
base64 = "0.22.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
rayon = "1.12.0"
regex = "1.13.1"
bitflag = "0.10.1"
async-trait = "0.1.92"
async-recursion = "1.1.1"
rand = "0.10.2"
zip = "8.6.0"
fatfs = "0.3.6"
x86-native = { git = "https://github.com/mkrueger/x86" }
sha2 = "0.10.9"

walkdir = "2.2.6"
i18n-embed = { version = "0.16.0", features = [
	"fluent-system",
	"desktop-requester",
] }
i18n-embed-fl = "0.10.1"
fluent-bundle = "0.16.0"
rust-embed = "8.12.0"
once_cell = "1.21.4"
unicase = "2.9.0"
toml = "1.1.4"
fastrand = "2"
color-eyre = "0.6.5"
tempfile = "3.27.0"
substring = "1.4.5"
strum = "0.28.0"
strum_macros = "0.28.0"
itertools = "0.15.0"
fern = "0.7.1"
ariadne = "0.6.0"
relative-path = "2.0.1"
bitflags = "2.13.1"
tui-markdown = "0.3"
tui-input = "0.15.4"

russh = "0.62.7"

[profile.release]
opt-level = 'z'   # Optimize for size
lto = true        # Enable link-time optimization
codegen-units = 1 # Reduce number of codegen units to increase optimizations
panic = 'abort'   # Abort on panic
strip = true      # Strip symbols from binary*

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 3

[patch."https://github.com/mkrueger/icy_board"]
codepages = { path = "crates/codepages" }
icy_net = { path = "crates/icy_net" }
