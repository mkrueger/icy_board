[workspace]
resolver = "2"
members = [
	"crates/icy_board_engine",
	"crates/jamjam",
	"crates/dizbase",
	"crates/codepages",
	"crates/pplc",
	"crates/ppld",
	"crates/ppl-lsp",
	"crates/icy_board_tui",
	"crates/mkicbmnu",
	"crates/icy_net",
	"crates/mkicbtxt",
	"crates/icboard",
	"crates/icbsetup",
	"crates/icbmailer",
	"crates/icbsm",
	"crates/icbfile",
	"crates/icbadmin",
	"crates/tree-sitter-ppl",
]
[workspace.package]
version = "0.2.0"
edition = "2024"
authors = ["Mike Krüger <mkrueger@posteo.de>"]

[workspace.dependencies]
codepages = { path = "crates/codepages" }
dizbase = { path = "crates/dizbase" }
jamjam = { path = "crates/jamjam" }
icy_board_tui = { path = "crates/icy_board_tui" }

icy_net = { path = "crates/icy_net" }
icy_board_engine = { path = "crates/icy_board_engine" }
icy_engine = { git = "https://github.com/mkrueger/icy_tools" }
icy_parser_core = { git = "https://github.com/mkrueger/icy_tools" }

lazy_static = "1.5.0"
semver = { version = "1.0.23", features = ["serde"] }
thiserror = "2.0.17"
argh = "0.1.12"
crossterm = "0.29.0"
ratatui = "0.30.0"
log = "0.4.25"
chrono = { version = "0.4.37", features = ["serde"] }
bstr = "1.10.0"
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.43.0", features = ["full"] }
rayon = "1.10.0"
regex = "1.11.3"
bitflag = "0.10.1"
async-trait = "0.1.89"
async-recursion = "1.1.1"
rand = "0.10.0"
zip = "8.6.0"

walkdir = "2.2.6"
i18n-embed = { version = "0.16.0", features = [
	"fluent-system",
	"desktop-requester",
] }
i18n-embed-fl = "0.10.0"
fluent-bundle = "0.16.0"
rust-embed = "8.5.0"
once_cell = "1.20.2"
unicase = "2.7.0"
toml = "1.1.0"
fastrand = "2"
color-eyre = "0.6.2"
tempfile = "3.23.0"
substring = "1.4.5"
strum = "0.28.0"
strum_macros = "0.28.0"
itertools = "0.15.0"
fern = "0.7.0"
ariadne = "0.6.0"
relative-path = "2.0.1"
bitflags = "2.10.0"
tui-markdown = "0.3"
tui-input = "0.15.3"
# tui-markdown = { git = "https://github.com/joshka/tui-markdown" }

russh = "0.62.0"

[profile.release]
opt-level = 'z'   # Optimize for size
lto = true        # Enable link-time optimization
codegen-units = 1 # Reduce number of codegen units to increase optimizations
panic = 'abort'   # Abort on panic
strip = true      # Strip symbols from binary*

[profile.dev]
opt-level = 3

[patch."https://github.com/mkrueger/icy_board"]
icy_net = { path = "crates/icy_net" }
